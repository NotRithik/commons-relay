[workspace]

[package]
name = "commons-relay-wallet"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
keycard_wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
authenticated_transfer_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
vault_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
system_accounts = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401", features = ["client"] }
anyhow = "1"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
borsh = { version = "1.6", features = ["derive"] }
url = "2"
hex = "0.4"
libc = "0.2"
log = "0.4"
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"] }
risc0-binfmt = "=3.0.4"
risc0-zkos-v1compat = "=2.2.2"

[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }

[profile.dev]
debug = "line-tables-only"

# Keep the bounded faucet work solver usable in ordinary developer builds.
# Proving remains real and uses the pinned external IPC prover.
[profile.dev.package.commons-relay-wallet]
opt-level = 2

# SHA-256's compression backend is a separately compiled dependency. Optimizing
# only this executable leaves the bounded public faucet work search very slow.
[profile.dev.package."sha2:0.10.9"]
opt-level = 3
