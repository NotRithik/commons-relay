name: CommonsRelay core, wallet and local process tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install operating-system crypto libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsodium23 openssl
      - name: Run core, crypto, protocol and tooling tests without network services
        run: python3 -m unittest discover -s tests -v
      - name: Validate shell entrypoints
        run: /bin/sh -n scripts/prepare-local.sh

  planner-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adapters/pi/package-lock.json
      - name: Install locked planner dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --prefix adapters/pi
      - name: Run deterministic Pi adapter and budget tests
        run: npm --prefix adapters/pi test
      - name: Test the actual owner UI functions and native contract
        run: node --test tests/ui-owner-form.test.mjs

  wallet-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RISC0_DEV_MODE: '0'
      RISC0_PROVER: ipc
      RISC0_EXECUTOR: ipc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ordinary compilation prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev pkg-config libssl-dev libpcsclite-dev libgmp-dev libomp-dev unzip
          rustup toolchain install 1.94.0 --profile minimal
      - name: Fetch SHA256-pinned proving libraries and locked Rust dependencies
        run: |
          python3 scripts/fetch-proof-deps.py out/ci-proof-deps
          cargo +1.94.0 fetch --locked --manifest-path wallet/Cargo.toml
          python3 - <<'PY'
          import json, os
          p=json.load(open('out/ci-proof-deps/paths.json'))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('LBC_ROOT_DIR='+p['lbc_root']+'\n')
              f.write('RAPIDSNARK_LIB_DIR='+p['rapidsnark_lib']+'\n')
              f.write('RISC0_SERVER_PATH='+p['r0vm']+'\n')
              f.write('LD_LIBRARY_PATH='+p['rapidsnark_lib']+'\n')
          PY
      - name: Run wallet transaction and recovery tests offline
        run: cargo +1.94.0 test --locked --offline --manifest-path wallet/Cargo.toml

  native-modules:
    name: Clean native Basecamp modules (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      COMMONS_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install system compilation and Qt prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake build-essential nlohmann-json3-dev libarchive-tools libgl1-mesa-dev libfontconfig1-dev libxkbcommon-dev libxcb-cursor0 libdbus-1-3
      - name: Fetch verified Qt archives and pinned Logos sources
        run: |
          python3 scripts/fetch-qt.py "$RUNNER_TEMP/relay-qt"
          python3 scripts/fetch-native-deps.py "$RUNNER_TEMP/relay-logos"
      - name: Build from the documented entrypoint without project-local caches
        run: |
          export QT_PREFIX="$RUNNER_TEMP/relay-qt/prefix"
          export LOGOS_DEPS_DIR="$RUNNER_TEMP/relay-logos"
          /bin/sh scripts/build-native.sh
      - name: Check installed payloads and QML syntax
        run: |
          test -f out/modules/commons_relay_module/commons_relay_module_plugin.so
          test -f out/modules/commons_relay_wallet/commons_relay_wallet_plugin.so
          test -f out/modules/commons_relay_owner_ui/commons_relay_owner_ui_plugin.so
          test -f out/modules/commons_relay_owner_ui/commons_relay_owner_ui_replica_factory.so
          test -f out/modules/commons_relay_owner_ui/commons_relay_owner_ui.py
          test -f out/modules/commons_relay_module/commons_relay/planner.py
          "$RUNNER_TEMP/relay-qt/prefix/bin/qmlformat" native/ui/src/qml/Main.qml >/dev/null
      - name: State the acceptance boundary
        run: echo 'A compiled module is not live UI or chain acceptance. No wallet, model key, transaction, or test fixture is part of these native packages.'
