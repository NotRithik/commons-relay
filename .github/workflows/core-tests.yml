name: CommonsRelay core and local process tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install operating-system crypto libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsodium23 openssl
      - name: Run core, crypto and process tests without network services
        run: python3 -m unittest discover -s tests -v
